name: Publication Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le projet
        run: |
          npm test
          npm run check

      - name: Vérifier la version du tag
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") { throw "Le tag doit être v$packageVersion." }

      - name: Construire l'installateur et les manifestes
        run: npm run dist:win -- --publish never

      - name: Publier dans le dépôt public de mises à jour
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".yml", ".blockmap" } | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "Aucun artefact de mise à jour généré." }
          gh release create "${{ github.ref_name }}" $assets --repo Harz-Karreg/harz_truck_planner-releases --title "HARZ KARREG ${{ github.ref_name }}" --generate-notes
